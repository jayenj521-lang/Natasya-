<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untuk Kamu ❤️</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            text-align: center;
            color: white;
        }

        .container {
            padding: 50px 20px;
        }

        h1 {
            font-size: 32px;
        }

        .foto {
            width: 220px;
            height: 220px;
            object-fit: cover;
            border-radius: 50%;
            border: 5px solid white;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }

        .kata {
            background: rgba(255,255,255,0.2);
            padding: 20px;
            margin: 30px auto;
            max-width: 500px;
            border-radius: 20px;
            font-size: 18px;
            line-height: 1.6;
        }

        button {
            background: white;
            color: #ff5f7e;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>💖 Untuk Kamu, Sayang 💖</h1>

        <!-- GANTI FOTO DI SINI -->
        <img src="foto.jpg" class="foto">

        <div class="kata">
            Terima kasih sudah hadir di hidup aku ❤️<br><br>

            Kamu adalah salah satu alasan aku bisa tersenyum
            setiap hari. Semoga kita selalu bisa saling menjaga,
            saling memahami, dan tetap bersama. 🥰<br><br>

            <b>Aku sayang kamu ❤️</b>
        </div>

        <button onclick="alert('Aku sayang kamu selamanya ❤️')">
            Klik di sini 💌
        </button>

    </div>

</body>
</html>
